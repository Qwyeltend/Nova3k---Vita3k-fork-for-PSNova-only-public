# Nova3K: builds the Android APK (arm64).
# Runs only when started by hand (Actions -> Nova3K Android -> Run workflow),
# so changes can pile up on main without spending a build on each push.
# The finished APK is attached to the workflow run as an artifact
# and also published as the "latest" GitHub release for easy download.
name: Nova3K Android

on:
  workflow_dispatch:

concurrency:
  group: nova3k-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bincache-android-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle') }}
          restore-keys: |
            vcpkg-bincache-android-

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Android build environment
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          bash ./.ci/setup-android.sh

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: nova3k-android

      # PSO2 offline: PhantasyServer by Anton Maltsev (MIT), built into Nova3K as a static library.
      # Only built when the vendored copy is present (pso2 branch). Failure here does not stop the APK:
      # Nova3K then falls back to its own small built-in server.
      - name: Set up Rust (PSO2 server)
        if: hashFiles('external/phantasyserver/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build (PSO2 server)
        if: hashFiles('external/phantasyserver/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: external/phantasyserver

      - name: Build PSO2 server (PhantasyServer) for Android
        if: hashFiles('external/phantasyserver/Cargo.toml') != ''
        # Nova3K: on the pso2 branch an APK without the server is useless (endless "Authenticating"): stop
        continue-on-error: ${{ github.ref_name != 'pso2' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -eo pipefail
          mkdir -p out
          {
            cargo install cargo-ndk --locked
            cd external/phantasyserver
            # compile the server data (maps, quests, enemies, items) on the build machine
            cargo run --release -p data_compiler -- data
            ls -l data/com_data.mp
            export NOVA3K_COM_DATA="$PWD/data/com_data.mp"
            cargo ndk -t arm64-v8a --platform 28 build --release -p nova3k_embed
            ls -l target/aarch64-linux-android/release/libnova3k_embed.a
            bash ../../tools/nova3k/pso2-server-lua.sh
          } 2>&1 | tee out/pso2-server-build.log

      - name: Build APK
        env:
          # Fixed personal signing key, so updates install over the old app.
          SIGNING_STORE_PATH: ${{ github.workspace }}/android/nova3k.jks
          SIGNING_STORE_PASSWORD: nova3kpass
          SIGNING_KEY_ALIAS: nova3k
          SIGNING_KEY_PASSWORD: nova3kpass
          VCPKG_ROOT: /usr/local/share/vcpkg
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -o pipefail
          mkdir -p logs
          bash ./.ci/build-android.sh out 2>&1 | tee logs/apk-build.log
          # main = stable Nova build; other branches (e.g. pso2) get their name in the file name
          prefix="Nova3K"
          [ "${{ github.ref_name }}" = "main" ] || prefix="Nova3K-${{ github.ref_name }}"
          mv out/app.apk "out/${prefix}-$(git rev-parse --short HEAD).apk"
          ls -l out

      - name: Publish build log on failure ("<branch>-build-log" release)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}-build-log"
          gh release delete "$tag" --yes --cleanup-tag || true
          tail -c 3000000 logs/apk-build.log > logs/apk-build-tail.log || true
          gh release create "$tag" logs/apk-build-tail.log $(ls out/*.log 2>/dev/null) --title "Build log ($(git rev-parse --short HEAD))" \
            --notes "Failed build log" --target "${{ github.sha }}" --prerelease

      - name: Collect native library with symbols (for profiling)
        run: |
          lib=$(find android/app/build -name libVita3K.so -path '*/obj/arm64-v8a/*' | head -n 1)
          echo "unstripped library: $lib"
          mkdir -p symbols && cp "$lib" symbols/ && ls -l symbols


      - name: Publish release (main -> "latest", other branches -> "<branch>-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="latest"
          [ "${{ github.ref_name }}" = "main" ] || tag="${{ github.ref_name }}-latest"
          gh release delete "$tag" --yes --cleanup-tag || true
          (cd symbols && zip -9 -q ../out/libVita3K-symbols.zip libVita3K.so)
          gh release create "$tag" out/*.apk out/libVita3K-symbols.zip $(ls out/*.log 2>/dev/null) \
            --title "Nova3K $tag build ($(git rev-parse --short HEAD))" \
            --notes "Automatic build from commit ${{ github.sha }}: $(git log -1 --pretty=%s)" \
            --target "${{ github.sha }}"
